name: Smoke Test (make start)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install tmux (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install --yes tmux

      - name: Install tmux (macOS)
        if: runner.os == 'macOS'
        run: brew list tmux 2>/dev/null || brew install tmux

      - name: Sync dependencies
        run: uv sync

      # GitHub's macOS runners have no Docker daemon and can't run one — no nested virtualization,
      # so colima/lima's VM fails to boot. `panopticon host` now preflights the daemon (REQ-031) and
      # refuses to start without one, which is exactly this runner's real, permanent condition — so
      # this leg verifies that refusal directly instead of forcing a full service startup.
      - name: Verify host refuses without a Docker daemon (macOS)
        if: runner.os == 'macOS'
        run: |
          set +e
          output=$(uv run panopticon host 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 0 ]; then
            echo "expected \`panopticon host\` to refuse without a reachable Docker daemon" >&2
            exit 1
          fi
          echo "$output" | grep --fixed-strings --quiet "Docker daemon unreachable"

      - name: Start host services (Linux)
        if: runner.os == 'Linux'
        run: make host

      - name: Wait for service health check (Linux)
        if: runner.os == 'Linux'
        run: |
          for i in $(seq 1 60); do
            if curl --silent --fail http://localhost:8000/healthz; then
              echo ""
              echo "Service is up"
              exit 0
            fi
            sleep 1
          done
          echo "Service did not come up within 60 seconds"
          exit 1

      - name: Verify service tmux session (Linux)
        if: runner.os == 'Linux'
        run: tmux -L panopticon has-session -t service

      - name: Verify runner tmux session (Linux)
        if: runner.os == 'Linux'
        run: tmux -L panopticon has-session -t runner

      - name: Dump logs on failure (Linux)
        if: failure() && runner.os == 'Linux'
        run: |
          echo "=== service pane ==="
          tmux -L panopticon capture-pane -t service -p 2>/dev/null || echo "(no session)"
          echo "=== runner pane ==="
          tmux -L panopticon capture-pane -t runner -p 2>/dev/null || echo "(no session)"
          echo "=== service log ==="
          cat /tmp/panopticon-service.log 2>/dev/null || echo "(no log)"
          echo "=== runner log ==="
          cat /tmp/panopticon-runner.log 2>/dev/null || echo "(no log)"

      - name: Stop services (Linux)
        if: always() && runner.os == 'Linux'
        run: make stop
